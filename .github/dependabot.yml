# Dependabot opens one grouped pull request for each ecosystem each week.
# Security updates also go into one grouped pull request.
# The auto-merge workflow merges patch and minor updates after CI passes.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - patch
          - minor
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
